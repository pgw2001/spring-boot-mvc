<!doctype html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout/fragments :: head((${post.id} != null ? '글 수정' : '새 글') +  ' | [블로그 이름]')}">
  <title>새 글 | [블로그 이름]</title>
</head>
<body>
<div class="viewport">

  <header class="appbar appbar--editor">
    <a class="btn-text btn-text--plain" th:href="@{/posts}">취소</a>
    <span class="appbar__title" th:text="${post.id} != null ? '글 수정' : '새 글'">새 글</span>
    <button class="btn-text btn-text--accent" form="post-form" type="submit">저장</button>
  </header>

  <main class="editor-main">
    <form class="editor" id="post-form" method="post"
          th:action="@{${post.id == null ? '/posts' : '/posts/' + post.id + '/edit'}}" th:object="${post}">
      <input autocomplete="off" class="editor__title" placeholder="제목" required th:field="*{title}" type="text">
      <textarea class="editor__body" name="content" placeholder="오늘은 어떤 이야기를 남길까요?" th:field="*{content}"></textarea>
    </form>
  </main>

</div>
</body>
</html>
