<!doctype html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="utf-8">
  <meta content="width=device-width, initial-scale=1, viewport-fit=cover" name="viewport">
  <title>글 수정 — [블로그 이름]</title>
  <link href="https://fonts.googleapis.com" rel="preconnect">
  <link crossorigin href="https://fonts.gstatic.com" rel="preconnect">
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&display=swap"
        rel="stylesheet">
  <link rel="stylesheet" th:href="@{/assets/style.css}">
</head>
<body>
<div class="viewport">

  <header class="appbar appbar--editor">
    <a class="btn-text btn-text--plain" href="post.html">취소</a>
    <span class="appbar__title">글 수정</span>
    <button class="btn-text btn-text--accent" form="post-form" type="submit">저장</button>
  </header>

  <main class="editor-main">
    <form action="/posts/1" class="editor" id="post-form" method="post">
      <input autocomplete="off" class="editor__title" name="title" required type="text" value="덜어내는 연습">
      <textarea class="editor__body" name="content">화면에서 무언가를 지울 때마다 남은 것이 더 잘 보입니다.

버튼을 하나 줄이고, 문장을 반으로 잘랐습니다. 그러고 나니 정말 중요한 것이 무엇이었는지 알겠더군요.</textarea>
    </form>
  </main>

  <div class="danger-zone">
    <a class="btn-danger" href="#delete">이 글 삭제하기</a>
  </div>

</div>

<div class="modal" id="delete">
  <div class="modal__inner">
    <a aria-label="닫기" class="modal__scrim" href="#"></a>
    <div aria-labelledby="delete-title" aria-modal="true" class="modal__dialog" role="dialog">
      <h2 class="modal__title" id="delete-title">이 글을 삭제할까요?</h2>
      <p class="modal__text">삭제한 글은 다시 되돌릴 수 없습니다.</p>
      <form action="/posts/1/delete" class="modal__actions" method="post">
        <a class="btn-block btn-block--ghost" href="#">취소</a>
        <button class="btn-block btn-block--danger" type="submit">삭제</button>
      </form>
    </div>
  </div>
</div>
</body>
</html>
