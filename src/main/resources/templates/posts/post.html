<!doctype html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout/fragments :: head(${post.title + ' | [블로그 이름]'})}">
</head>
<body>
<div class="viewport">

  <header class="appbar appbar--article">
    <a aria-label="목록으로" class="btn-icon" th:href="@{/posts}">
      <svg aria-hidden="true" fill="none" height="22" viewBox="0 0 24 24" width="22">
        <path d="M14.5 5.5 8 12l6.5 6.5" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"
              stroke-width="1.7"></path>
      </svg>
    </a>
    <div class="appbar__actions">
      <form method="post" style="display:inline" th:action="@{/posts/{id}/pin(id=${post.id})}">
        <button class="btn-text"
                th:classappend="${post.isPinned} ? 'btn-text--muted' : 'btn-text--accent'"
                th:text="${post.isPinned} ? '고정 해제' : '고정'"></button>
      </form>
      <a class="btn-text btn-text--accent" th:href="@{/posts/{id}/edit(id=${post.id})}">수정</a>
      <a class="btn-text btn-text--muted" href="#delete">삭제</a>
    </div>
  </header>

  <main>
    <article class="article">
      <h1 class="article__title" th:text="${post.title}">이 블로그를 시작하며</h1>
      <time class="article__date" th:datetime="${post.formattedCreatedAt}" th:text="${post.formattedCreatedAt}">2026년 8월
        30일
      </time>
      <hr class="article__divider">
      <div class="article__body">
        <p th:text="${post.content}">기록하지 않으면 사라지는 것들이 있습니다.</p>
      </div>
    </article>
  </main>

</div>

<div class="modal" id="delete">
  <div class="modal__inner">
    <a aria-label="닫기" class="modal__scrim" href="#"></a>
    <div aria-labelledby="delete-title" aria-modal="true" class="modal__dialog" role="dialog">
      <h2 class="modal__title" id="delete-title">이 글을 삭제할까요?</h2>
      <p class="modal__text">삭제한 글은 다시 되돌릴 수 없습니다.</p>
      <form class="modal__actions" method="post" th:action="@{/posts/{id}/delete(id=${post.id})}">
        <a class="btn-block btn-block--ghost" href="#">취소</a>
        <button class="btn-block btn-block--danger" type="submit">삭제</button>
      </form>
    </div>
  </div>
</div>
</body>
</html>
